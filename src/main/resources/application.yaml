server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

spring:
  application:
    name: tgbot
  config:
    import: "optional:file:.env[.properties]"
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tg-bot}
      database: ${MONGODB_DATABASE:tg-bot}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  adminId: ${APP_ADMIN_ID:0}
  adminBot: ${APP_ADMIN_BOT:}
  webhook: ${APP_WEBHOOK:https://bot.nikichxp.xyz/handle}
  localEnv: ${APP_LOCAL_ENV:false}
  suspendBotRegistering: ${APP_SUSPEND_BOT_REGISTERING:false}
  tracer:
    store: ${APP_TRACER_STORE:true}
    ttl: ${APP_TRACER_TTL:24}
    capacity: ${APP_TRACER_CAPACITY:100}
    token: ${APP_TRACER_TOKEN:}
  openRouter:
    apiKey: ${OPENROUTER_API_KEY:}
    defaultModel: ${OPENROUTER_DEFAULT_MODEL:openrouter/auto}
    baseUrl: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    referer: ${OPENROUTER_REFERER:https://github.com/NikichXP/tgbot}
    title: ${OPENROUTER_TITLE:NikichXP TG Bot}
    transcriptionModel: ${OPENROUTER_TRANSCRIPTION_MODEL:openai/whisper-1}
  discord:
    publicKey: ${DISCORD_PUBLIC_KEY:}
  okx:
    baseUrl: ${OKX_COLLECTOR_URL:http://localhost:8080}
  trustedUsers: ${APP_TRUSTED_USERS:}
  dashboard:
    telegramClientId: ${APP_DASHBOARD_TELEGRAM_CLIENT_ID:}
    allowedOrigins: ${APP_DASHBOARD_ALLOWED_ORIGINS:http://localhost:5173}
    accessTokenTtlMinutes: ${APP_DASHBOARD_ACCESS_TOKEN_TTL_MINUTES:15}
    secureCookie: ${APP_DASHBOARD_SECURE_COOKIE:true}
  maxRetryCount: ${APP_MAX_RETRY_COUNT:5}

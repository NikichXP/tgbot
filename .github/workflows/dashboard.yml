name: Dashboard Build and Deploy

on:
  push:
    branches:
      - "**"
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

env:
  NAMESPACE: tgbot
  API_BASE_URL: https://api.tgbot.nikichxp.xyz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Lint and type-check
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: dashboard
          file: dashboard/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
          tags: ${{ secrets.REGISTRY_URL }}/tgbot-dashboard:latest
          provenance: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_FILE: ${{ github.workspace }}/.kube/config
        run: |
          mkdir -p "$(dirname "$KUBECONFIG_FILE")"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d -i > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"
          echo "KUBECONFIG=$KUBECONFIG_FILE" >> "$GITHUB_ENV"

      - name: Roll out new image
        shell: bash
        run: |
          set -euo pipefail
          # the Deployment comes from infra-scripts via ArgoCD; skip until it exists
          if kubectl -n "$NAMESPACE" get deployment/tgbot-dashboard >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" rollout restart deployment/tgbot-dashboard
            kubectl -n "$NAMESPACE" rollout status deployment/tgbot-dashboard --timeout=300s
          fi

      - name: Cleanup kubeconfig
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/.kube/config"

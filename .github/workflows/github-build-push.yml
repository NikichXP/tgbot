name: CI/CD Build and Push

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

env:
  NAMESPACE: tgbot

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "adopt"
          cache: "gradle"

      - name: Build and test with Gradle
        run: ./gradlew build -PappVersion=v${{ github.run_number }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Upload boot jar
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download boot jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile_copy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.REGISTRY_URL }}/tgbot:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_FILE: ${{ github.workspace }}/.kube/config
        run: |
          mkdir -p "$(dirname "$KUBECONFIG_FILE")"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d -i > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"
          echo "KUBECONFIG=$KUBECONFIG_FILE" >> "$GITHUB_ENV"

      - name: Roll out new image
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout restart deployment/tgbot
          kubectl -n "$NAMESPACE" rollout status deployment/tgbot --timeout=300s

      - name: Cleanup kubeconfig
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/.kube/config"
